version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/examples/nextjs-app-router"
      - "/examples/vite-react-19"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    ignore:
      # Handle breaking major upgrades deliberately one-by-one (e.g. eslint v10 breaks eslint-plugin-jsx-a11y@6, typescript v7, tsup v9)
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions-dependencies:
        patterns:
          - "*"
