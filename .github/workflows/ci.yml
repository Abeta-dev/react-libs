name: CI Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write       # upload Pages artifact
  id-token: write    # OIDC token for trusted deployment

jobs:
  # ── 1. Static Analysis & Documentation ──────────────────────────────────────
  static-and-storybook:
    name: Static Analysis & Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Release Version & Changelog
        run: node scripts/verify-release-version.mjs

      - name: Type Definitions Check
        run: npx tsc --noEmit

      - name: Type Definitions Check (Auth Package)
        run: npm run --prefix packages/auth check:types

      - name: Lint (Static Analysis & Custom Rules)
        run: npm run lint

      - name: Verify Component Exports (Fast-Fail)
        run: node scripts/check-exports.mjs

      - name: Clean Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  # ── 2. Test Suite & Performance Gate ────────────────────────────────────────
  test-and-perf:
    name: Test Suite & Performance Gate
    runs-on: ubuntu-latest
    env:
      PERF_P95_THRESHOLD: 750
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Vitest (Full Test Suite + Coverage)
        run: npm run test

      - name: Performance Gate (P95 Enforcement)
        run: npm run perf

  # ── 3. Build & Release Integrity Truth Gate ─────────────────────────────────
  build-and-verify:
    name: Build & Release Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Library Package
        run: npm run build

      - name: Verify Packed External Consumers
        run: npm run verify:packed-consumers

      - name: Bundle Size Limit Gate
        run: npm run check:size

      - name: CI Truth Gate (docs-match-tree + attw matrix)
        run: npm run check:truth

      - name: Verify Module Directives & Universal Packaging
        run: node scripts/verify-directives.mjs

  # ── 4. Deploy (main only, after all 3 parallel jobs pass) ───────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: [static-and-storybook, test-and-perf, build-and-verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
