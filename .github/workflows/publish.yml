name: Publish – PROD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  gate-ci:
    name: Gate CI Check Runs
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read

    steps:
      - name: Verify CI Check-Runs on Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verifying that commit ${{ github.sha }} has no failed CI check-runs..."
          # Query GitHub API check-runs for this commit
          FAILED_CHECKS=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.conclusion == "failure" and (.name | test("publish|gate[- ]?ci"; "i") | not)) | .name') || {
            echo "❌ Failed to query GitHub Check Runs API for commit ${{ github.sha }}" >&2
            exit 1
          }
          if [ -n "$FAILED_CHECKS" ]; then
            echo "❌ Cannot release: One or more CI check-runs failed on commit ${{ github.sha }}:" >&2
            echo "$FAILED_CHECKS" >&2
            exit 1
          fi
          echo "✅ No failed CI check-runs found on commit ${{ github.sha }}."

  publish:
    name: Publish Packages
    needs: [gate-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Release Version & Changelog
        run: node scripts/verify-release-version.mjs

      - name: Verify Project Types
        run: npx tsc --noEmit

      - name: Lint (Static Analysis & Custom Rules)
        run: npm run lint

      - name: Verify Component Exports
        run: node scripts/check-exports.mjs

      - name: Build All Packages
        run: |
          echo "🔨 Compiling monorepo packages in dependency order..."

          echo "📦 [1/5] Building @abeta.dev/ui (packages/ui)..."
          npm run --workspace=packages/ui build

          echo "📦 [2/5] Building @abeta.dev/india (packages/india)..."
          npm run --workspace=packages/india build

          echo "📦 [3/5] Building @abeta.dev/talent (packages/talent)..."
          npm run --workspace=packages/talent build

          echo "📦 [4/5] Building @abeta.dev/auth (packages/auth)..."
          npm run --workspace=packages/auth build

          echo "📦 [5/5] Building root @abeta.dev/react-libs..."
          npm run build

          echo "✅ All 5 packages built successfully."

      - name: Verify Packed External Consumers
        run: npm run verify:packed-consumers

      - name: Bundle Size Limit Gate
        run: npm run check:size

      - name: CI Truth Gate (docs-match-tree)
        run: npm run check:truth

      - name: Verify Module Directives & Universal Packaging
        run: node scripts/verify-directives.mjs

      - name: Assure Test Coverage Checks
        run: npm run test

      - name: Performance Gate (P95 Enforcement)
        run: npm run perf

      - name: Extract Release Notes
        run: node scripts/extract-release-notes.mjs --output dist/release-notes.md

      - name: Verify Authentication
        run: npm whoami --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @abeta.dev/ui package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          UI_NAME=$(node -p "require('./packages/ui/package.json').name")
          UI_VERSION=$(node -p "require('./packages/ui/package.json').version")
          if npm view "${UI_NAME}@${UI_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "ℹ️  ${UI_NAME}@${UI_VERSION} already exists on npm; leaving untouched."
          else
            echo "🚀 Publishing ${UI_NAME}@${UI_VERSION} to npm..."
            npm publish -w packages/ui --access public --tag latest --provenance
            echo "✅ Successfully published ${UI_NAME}@${UI_VERSION} to npm."
          fi

      - name: Publish @abeta.dev/india package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          INDIA_NAME=$(node -p "require('./packages/india/package.json').name")
          INDIA_VERSION=$(node -p "require('./packages/india/package.json').version")
          if npm view "${INDIA_NAME}@${INDIA_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "ℹ️  ${INDIA_NAME}@${INDIA_VERSION} already exists on npm; leaving untouched."
          else
            echo "🚀 Publishing ${INDIA_NAME}@${INDIA_VERSION} to npm..."
            npm publish -w packages/india --access public --tag latest --provenance
            echo "✅ Successfully published ${INDIA_NAME}@${INDIA_VERSION} to npm."
          fi

      - name: Publish @abeta.dev/talent package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TALENT_NAME=$(node -p "require('./packages/talent/package.json').name")
          TALENT_VERSION=$(node -p "require('./packages/talent/package.json').version")
          if npm view "${TALENT_NAME}@${TALENT_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "ℹ️  ${TALENT_NAME}@${TALENT_VERSION} already exists on npm; leaving untouched."
          else
            echo "🚀 Publishing ${TALENT_NAME}@${TALENT_VERSION} to npm..."
            npm publish -w packages/talent --access public --tag latest --provenance
            echo "✅ Successfully published ${TALENT_NAME}@${TALENT_VERSION} to npm."
          fi

      - name: Publish @abeta.dev/auth package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          AUTH_NAME=$(node -p "require('./packages/auth/package.json').name")
          AUTH_VERSION=$(node -p "require('./packages/auth/package.json').version")
          if npm view "${AUTH_NAME}@${AUTH_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "ℹ️  ${AUTH_NAME}@${AUTH_VERSION} already exists on npm; leaving untouched."
          else
            echo "🚀 Publishing ${AUTH_NAME}@${AUTH_VERSION} to npm..."
            npm publish -w packages/auth --access public --tag latest --provenance
            echo "✅ Successfully published ${AUTH_NAME}@${AUTH_VERSION} to npm."
          fi

      - name: Publish root package (@abeta.dev/react-libs)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ROOT_NAME=$(node -p "require('./package.json').name")
          ROOT_VERSION=$(node -p "require('./package.json').version")
          AUTH_NAME=$(node -p "require('./packages/auth/package.json').name")
          AUTH_VERSION=$(node -p "require('./packages/auth/package.json').version")
          test "$(node -p "require('./package.json').dependencies['${AUTH_NAME}']")" = "${AUTH_VERSION}"
          if npm view "${ROOT_NAME}@${ROOT_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "ℹ️  ${ROOT_NAME}@${ROOT_VERSION} already exists on npm; leaving untouched."
          else
            echo "🚀 Publishing ${ROOT_NAME}@${ROOT_VERSION} to npm..."
            npm publish --access public --tag latest --provenance
            echo "✅ Successfully published ${ROOT_NAME}@${ROOT_VERSION} to npm."
          fi

      - name: Create GitHub Release when absent
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; leaving immutable release untouched."
          elif [ -f "dist/release-notes.md" ]; then
            gh release create "$TAG" --notes-file dist/release-notes.md --title "$TAG"
          else
            gh release create "$TAG" --notes-file <(awk '/^## \[/{n++} n==1' CHANGELOG.md) --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          echo "@abeta-dev:registry=https://npm.pkg.github.com" >> ~/.npmrc

          # Transform all package.json files for GitHub Packages:
          # 1. Scope remapping: @abeta.dev/* -> @abeta-dev/*
          # 2. Dependency remapping: all internal @abeta.dev/* deps -> @abeta-dev/*
          # 3. publishConfig: registry set to https://npm.pkg.github.com
          # 4. repository link: ensure repository URL and directory are present
          node -e '
            const fs = require("fs");
            const path = require("path");

            const packages = [
              { dir: "packages/ui", isWorkspace: true },
              { dir: "packages/india", isWorkspace: true },
              { dir: "packages/talent", isWorkspace: true },
              { dir: "packages/auth", isWorkspace: true },
              { dir: ".", isWorkspace: false }
            ];

            function transformPackage(pkgPath, dir, isWorkspace) {
              const p = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
              // 1. Rename scope @abeta.dev -> @abeta-dev
              p.name = p.name.replace(/^@abeta\.dev\//, "@abeta-dev/");
              p.publishConfig = { registry: "https://npm.pkg.github.com" };

              // 2. Ensure repository field for GitHub package linkage
              if (!p.repository || typeof p.repository === "string") {
                p.repository = {
                  type: "git",
                  url: "git+https://github.com/Abeta-dev/react-libs.git"
                };
              }
              if (isWorkspace) {
                p.repository.directory = dir;
              }

              // 3. Remap all internal @abeta.dev dependencies to @abeta-dev
              const depSections = ["dependencies", "peerDependencies", "optionalDependencies", "devDependencies"];
              for (const section of depSections) {
                if (!p[section]) continue;
                for (const depKey of Object.keys(p[section])) {
                  if (depKey.startsWith("@abeta.dev/")) {
                    const newKey = depKey.replace(/^@abeta\.dev\//, "@abeta-dev/");
                    p[section][newKey] = p[section][depKey];
                    delete p[section][depKey];
                  }
                }
              }

              fs.writeFileSync(pkgPath, JSON.stringify(p, null, 2) + "\n");
              console.log(`Transformed ${pkgPath} -> ${p.name}`);
            }

            for (const pkg of packages) {
              transformPackage(path.join(pkg.dir, "package.json"), pkg.dir, pkg.isWorkspace);
            }
          '

          # Publish packages to GitHub Packages in strict dependency order:
          # 1. @abeta-dev/ui
          # 2. @abeta-dev/india
          # 3. @abeta-dev/talent
          # 4. @abeta-dev/auth
          # 5. @abeta-dev/react-libs (root)

          PKGS=("packages/ui" "packages/india" "packages/talent" "packages/auth" ".")

          for PKG_DIR in "${PKGS[@]}"; do
            PKG_JSON="${PKG_DIR}/package.json"
            PKG_NAME=$(node -p "require('./${PKG_JSON}').name")
            PKG_VERSION=$(node -p "require('./${PKG_JSON}').version")
            echo "🔍 Processing ${PKG_NAME}@${PKG_VERSION} for GitHub Packages..."

            if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry=https://npm.pkg.github.com/ >/dev/null 2>&1; then
              echo "ℹ️  ${PKG_NAME}@${PKG_VERSION} already exists on GitHub Packages; leaving untouched."
            else
              echo "🚀 Publishing ${PKG_NAME}@${PKG_VERSION} to GitHub Packages..."
              if [ "$PKG_DIR" = "." ]; then
                npm publish --registry=https://npm.pkg.github.com/
              else
                npm publish -w "$PKG_DIR" --registry=https://npm.pkg.github.com/
              fi
              echo "✅ Successfully published ${PKG_NAME}@${PKG_VERSION} to GitHub Packages."
            fi
          done
