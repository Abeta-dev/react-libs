name: Publish – PROD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Cache Build & Storybook Artifacts
        uses: actions/cache@v4
        with:
          path: |
            dist
            packages/auth/dist
            storybook-static
            node_modules/.cache
            .turbo
          key: ${{ runner.os }}-artifacts-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-artifacts-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-artifacts-

      - name: Install Dependencies
        run: npm ci

      - name: Verify Release Version & Changelog
        run: node scripts/verify-release-version.mjs

      - name: Verify Project Types
        run: npx tsc --noEmit

      - name: Lint (Static Analysis & Custom Rules)
        run: npm run lint

      - name: Build Auth Package
        run: npm run --prefix packages/auth build

      - name: Build Package
        run: npm run build

      - name: Verify Packed External Consumers
        run: npm run verify:packed-consumers

      - name: Bundle Size Limit Gate
        run: npm run check:size

      - name: CI Truth Gate (docs-match-tree)
        run: npm run check:truth

      - name: Check Package Types Matrix (attw)
        run: npm run check:types-pkg

      - name: Verify Module Directives & Universal Packaging
        run: npm run check:directives

      - name: Verify Component Exports
        run: node scripts/check-exports.mjs

      - name: Performance Gate (P95 Enforcement)
        run: npm run perf

      - name: Assure Test Coverage Checks
        run: npm run test

      - name: Prebuild Storybook Artifacts
        run: |
          if [ -d "storybook-static" ] && [ -f "storybook-static/index.html" ]; then
            echo "Storybook already built for this commit; skipping."
          else
            npm run build-storybook
          fi

      - name: Extract Release Notes
        run: node scripts/extract-release-notes.mjs --output dist/release-notes.md

      - name: Verify Authentication
        run: npm whoami --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish auth package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          AUTH_NAME=$(node -p "require('./packages/auth/package.json').name")
          AUTH_VERSION=$(node -p "require('./packages/auth/package.json').version")
          if npm view "${AUTH_NAME}@${AUTH_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "${AUTH_NAME}@${AUTH_VERSION} already exists on npm; leaving untouched."
          else
            npm publish -w packages/auth --access public --tag latest --provenance
            echo "Successfully published ${AUTH_NAME}@${AUTH_VERSION} to npm."
          fi

      - name: Publish root package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ROOT_NAME=$(node -p "require('./package.json').name")
          ROOT_VERSION=$(node -p "require('./package.json').version")
          AUTH_NAME=$(node -p "require('./packages/auth/package.json').name")
          AUTH_VERSION=$(node -p "require('./packages/auth/package.json').version")
          test "$(node -p "require('./package.json').dependencies['${AUTH_NAME}']")" = "${AUTH_VERSION}"
          if npm view "${ROOT_NAME}@${ROOT_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "${ROOT_NAME}@${ROOT_VERSION} already exists on npm; leaving untouched."
          else
            npm publish --access public --tag latest --provenance
            echo "Successfully published ${ROOT_NAME}@${ROOT_VERSION} to npm."
          fi

      - name: Create GitHub Release when absent
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; leaving immutable release untouched."
          elif [ -f "dist/release-notes.md" ]; then
            gh release create "$TAG" --notes-file dist/release-notes.md --title "$TAG"
          else
            gh release create "$TAG" --notes-file <(awk '/^## \[/{n++} n==1' CHANGELOG.md) --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH_VERSION=$(node -p "require('./packages/auth/package.json').version")
          ROOT_VERSION=$(node -p "require('./package.json').version")

          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          echo "@abeta-dev:registry=https://npm.pkg.github.com" >> ~/.npmrc

          # Configure auth package for GitHub Packages
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("./packages/auth/package.json", "utf8"));
            p.name = "@abeta-dev/auth";
            p.publishConfig = { registry: "https://npm.pkg.github.com" };
            fs.writeFileSync("./packages/auth/package.json", JSON.stringify(p, null, 2));
          '

          if npm view "@abeta-dev/auth@${AUTH_VERSION}" version --registry=https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "@abeta-dev/auth@${AUTH_VERSION} already exists on GitHub Packages; leaving untouched."
          else
            npm publish -w packages/auth --registry=https://npm.pkg.github.com/
            echo "Successfully published @abeta-dev/auth@${AUTH_VERSION} to GitHub Packages."
          fi

          # Configure root package for GitHub Packages
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("./package.json", "utf8"));
            p.name = "@abeta-dev/react-libs";
            p.publishConfig = { registry: "https://npm.pkg.github.com" };
            if (p.dependencies && p.dependencies["@abeta.dev/auth"]) {
              p.dependencies["@abeta-dev/auth"] = p.dependencies["@abeta.dev/auth"];
              delete p.dependencies["@abeta.dev/auth"];
            }
            fs.writeFileSync("./package.json", JSON.stringify(p, null, 2));
          '

          if npm view "@abeta-dev/react-libs@${ROOT_VERSION}" version --registry=https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "@abeta-dev/react-libs@${ROOT_VERSION} already exists on GitHub Packages; leaving untouched."
          else
            npm publish --registry=https://npm.pkg.github.com/
            echo "Successfully published @abeta-dev/react-libs@${ROOT_VERSION} to GitHub Packages."
          fi

