name: Bug Report
description: Report a bug in any @abeta.dev/* React package
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please search existing issues first to avoid duplicates.

        *Note: If you discovered a security vulnerability, do NOT file a public issue. Follow our [Security Policy](https://github.com/Abeta-dev/react-libs/blob/main/SECURITY.md) or submit a private [Security Advisory](https://github.com/Abeta-dev/react-libs/security/advisories/new).*

  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Which @abeta.dev package is impacted?
      options:
        - "@abeta.dev/ui"
        - "@abeta.dev/india"
        - "@abeta.dev/talent"
        - "@abeta.dev/auth"
        - "@abeta.dev/react-libs (legacy omnibus)"
        - "Storybook / Documentation / Examples"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem in detail...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal reproduction code or a StackBlitz/CodeSandbox link is strongly encouraged.
      placeholder: |
        1. Import component/utility from '@abeta.dev/...'
        2. Pass prop / invoke function '...'
        3. Observe error or unexpected state
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: system-info
    attributes:
      label: Environment & System Info
      description: Share your environment details to help us reproduce quickly.
      value: |
        - Package & version (e.g. @abeta.dev/ui@0.21.0):
        - React version (18 or 19):
        - Framework / Bundler (Next.js App Router, Vite, etc.):
        - Tailwind CSS version (v4 / none):
        - OS & Browser:
        - Node.js version:
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots / Logs / Additional Context
      description: Attach screenshots, stack traces, or workarounds tested.
    validations:
      required: false
