name: Feature Request
description: Propose a new component, utility, or capability across the @abeta.dev/* React ecosystem
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a new feature for the **Abeta React Ecosystem (`@abeta.dev/*`)**!

  - type: dropdown
    id: package
    attributes:
      label: Target Package
      description: Which scoped package should own this capability?
      options:
        - "@abeta.dev/ui (Design System & Primitives)"
        - "@abeta.dev/india (India Statutory & FinTech)"
        - "@abeta.dev/talent (Credentials, Quizzes & Hiring)"
        - "@abeta.dev/auth (Headless Auth & Auth UI)"
        - "New Scoped Package / Ecosystem Tooling"
    validations:
      required: true

  - type: textarea
    id: problem-description
    attributes:
      label: Problem Description
      description: Describe the workflow gap or developer pain point this solves.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed API & Solution
      description: Describe the desired exports, props, RSC vs client boundary, and accessibility behavior.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Alternatives & Examples
      description: Links to Figma references, Storybook patterns, or prior art.
    validations:
      required: false
